<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Illumigoon test</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      background: #111;
      color: #eee;
      font: 16px/1.4 -apple-system, system-ui, sans-serif;
    }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    label { display: block; margin-bottom: 4px; color: #aaa; }
    input, button {
      font: inherit;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1c1c1c;
      color: inherit;
      box-sizing: border-box;
    }
    input { width: 100%; margin-bottom: 8px; }
    button { width: 100%; }
    #lights button { margin-bottom: 8px; text-align: left; }
    #searching { color: #aaa; }
    #result { margin: 16px 0; padding: 12px; border-radius: 6px; background: #1c1c1c; }
    #result.pass { background: #123d1f; }
    #result.fail { background: #4a1616; }
    #log { font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; color: #bbb; }
  </style>
</head>
<body>
  <h1>Light connection test</h1>
  <p id="searching">Looking for lights.</p>
  <div id="lights"></div>
  <form id="manual">
    <label for="host">Or type an address</label>
    <input id="host" inputmode="decimal" autocomplete="off">
    <button>Connect</button>
  </form>
  <div id="result">Tap a light.</div>
  <div id="log"></div>
  <script src="app.js"></script>
</body>
</html>
