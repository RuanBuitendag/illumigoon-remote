# Builds the iPhone app as an unsigned Illumigoon.ipa; SideStore signs and installs it on the phone.
# Runs by hand only: macOS minutes count ten times against the private repo quota.
name: iOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Illumigoon.ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app is not on this runner; using the default Xcode."
          fi
          xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Archive (no code signing)
        env:
          RUN: ${{ github.run_number }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            MARKETING_VERSION="0.$RUN" CURRENT_PROJECT_VERSION="$RUN" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          plutil -p Payload/App.app/Info.plist | grep -E 'NSLocalNetworkUsageDescription|NSAllowsLocalNetworking'
          zip -qry Illumigoon.ipa Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Illumigoon-ipa
          path: Illumigoon.ipa
          if-no-files-found: error
